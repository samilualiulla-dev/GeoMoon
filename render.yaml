# Render Blueprint: backend (FastAPI) + frontend (static site). Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: geomoon-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: bash backend/scripts/render_build.sh
    startCommand: cd backend && uvicorn app.asgi:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEOMOON_CORS_ORIGINS
        value: https://geomoon.onrender.com
  - type: web
    name: geomoon
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://geomoon-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
